# Nginx Configuration for collabcodeio.xyz
# Place this file on your VPS at: /etc/nginx/sites-available/collabcodeio.xyz
# Then link it: sudo ln -s /etc/nginx/sites-available/collabcodeio.xyz /etc/nginx/sites-enabled/

# 1. Main Web Application (collabcodeio.xyz & www.collabcodeio.xyz) -> Next.js on port 3000
server {
    listen 80;
    listen [::]:80;
    server_name collabcodeio.xyz www.collabcodeio.xyz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend Server & Real-Time WebSockets (api.collabcodeio.xyz) -> Express + Socket.IO on port 4000
server {
    listen 80;
    listen [::]:80;
    server_name api.collabcodeio.xyz;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (Crucial for Socket.io and Yjs CRDT collaboration)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive settings for long-lived socket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}

# 3. Standalone Admin Dashboard (admin.collabcodeio.xyz) -> Admin server on port 3001
server {
    listen 80;
    listen [::]:80;
    server_name admin.collabcodeio.xyz;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
